name: Public Wayback single-connection feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wayback-snapshot
  cancel-in-progress: false
jobs:
  persistent-public-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline persistence regression tests
        run: |
          test_dir=$(mktemp -d)
          trap 'rm -rf "$test_dir"' EXIT
          cd "$test_dir"
          env -u GITHUB_STEP_SUMMARY PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v test_diagnose_persistent_connection
      - name: Two public GETs on at most one connection
        run: python diagnose_persistent_connection.py
      - name: Publish sanitized feasibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: persistent-connection-${{ github.run_id }}-${{ github.run_attempt }}
          path: persistent-connection-report.json
          if-no-files-found: warn
          retention-days: 90
