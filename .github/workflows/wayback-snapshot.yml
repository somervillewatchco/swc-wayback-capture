name: Daily Wayback Machine Policy Snapshot
run-name: Cart and policies - ${{ github.event_name == 'schedule' && (github.event.schedule == '0 21 * * *' && 'retry' || github.event.schedule == '0 9 * * *' && 'primary' || 'superseded') || 'manual' }}
on:
  schedule:
    # Fixed EST (UTC-5): daily primary at 4 a.m.; retry at 4 p.m. only after failure.
    - cron: '0 9 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Temporary cart/policy-only capture; product page reads are paused'
        type: choice
        options: [policies]
        default: policies
      outlink_page:
        description: 'Single Shop All outlink page (only for outlink_probe; never a bulk loop)'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']
        default: '1'
      verify_only:
        description: 'Read archive evidence without submitting captures'
        type: boolean
        default: true
      diagnostic:
        description: 'Public GET-only transport diagnosis; no captures or state cache changes'
        type: boolean
        default: false
      recovery_cache_key:
        description: 'Optional exact prior state cache to recover; forces no-submission polling'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: wayback-snapshot
  cancel-in-progress: false
jobs:
  archive-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: |
          test_dir=$(mktemp -d)
          trap 'rm -rf "$test_dir"' EXIT
          cd "$test_dir"
          env -u GITHUB_STEP_SUMMARY PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v test_capture test_diagnose_transport
      - name: Gate the failure-only scheduled retry
        id: schedule_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python capture_schedule.py
      - name: Restore unresolved jobs and host cooldown
        if: ${{ steps.schedule_gate.outputs.run_capture == 'true' && !inputs.diagnostic }}
        uses: actions/cache/restore@v4
        with:
          path: .capture-state
          key: ${{ inputs.recovery_cache_key || format('wayback-state-v1-{0}-{1}', github.run_id, github.run_attempt) }}
          restore-keys: ${{ !inputs.recovery_cache_key && 'wayback-state-v1-' || '' }}
      - name: Capture and independently verify
        if: ${{ steps.schedule_gate.outputs.run_capture == 'true' && !inputs.diagnostic }}
        env:
          ARCHIVE_ORG_ACCESS_KEY: ${{ secrets.ARCHIVE_ORG_ACCESS_KEY }}
          ARCHIVE_ORG_SECRET_KEY: ${{ secrets.ARCHIVE_ORG_SECRET_KEY }}
          RECOVERY_CACHE_KEY: ${{ inputs.recovery_cache_key }}
          OUTLINK_PAGE: ${{ inputs.outlink_page || '1' }}
          SCOPE: policies
          VERIFY_ONLY: ${{ inputs.verify_only && 'true' || 'false' }}
        run: |
          args=(--scope "$SCOPE" --outlink-page "$OUTLINK_PAGE")
          if [[ "$SCOPE" == policies ]]; then
            args+=(--daily-batches --budget 19800)
          fi
          if [[ -n "$RECOVERY_CACHE_KEY" ]]; then
            args+=(--poll-only)
          elif [[ "$VERIFY_ONLY" == true ]]; then
            args+=(--verify-only)
          fi
          python capture.py "${args[@]}"
      - name: Preserve unresolved jobs even when verification fails
        if: ${{ always() && steps.schedule_gate.outputs.run_capture == 'true' && !inputs.diagnostic }}
        uses: actions/cache/save@v4
        with:
          path: .capture-state
          key: ${{ inputs.recovery_cache_key && 'wayback-recovery-v1' || 'wayback-state-v1' }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish per-URL evidence
        if: ${{ always() && steps.schedule_gate.outputs.run_capture == 'true' && !inputs.diagnostic }}
        uses: actions/upload-artifact@v4
        with:
          name: capture-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            capture-report.json
            operational-report.json
          if-no-files-found: warn
          retention-days: 90
      - name: Public read-only transport diagnostics
        if: ${{ inputs.diagnostic }}
        timeout-minutes: 5
        run: python diagnose_transport.py
      - name: Publish sanitized transport evidence
        if: ${{ always() && inputs.diagnostic }}
        uses: actions/upload-artifact@v4
        with:
          name: transport-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: transport-report.json
          if-no-files-found: warn
          retention-days: 90
