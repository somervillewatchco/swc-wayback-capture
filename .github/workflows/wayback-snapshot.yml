name: Daily Wayback Machine Policy Snapshot
on:
  schedule:
    - cron: '7 8 * * *'
    - cron: '43 9 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Capture scope (pilot is warranty only)'
        type: choice
        options: [pilot, priority, all]
        default: pilot
      verify_only:
        description: 'Read archive evidence without submitting captures'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: wayback-snapshot
  cancel-in-progress: false
jobs:
  archive-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python -m unittest -v test_capture
      - name: Restore unresolved jobs and host cooldown
        uses: actions/cache/restore@v4
        with:
          path: .capture-state
          key: wayback-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wayback-state-v1-
      - name: Capture and independently verify
        env:
          ARCHIVE_ORG_ACCESS_KEY: ${{ secrets.ARCHIVE_ORG_ACCESS_KEY }}
          ARCHIVE_ORG_SECRET_KEY: ${{ secrets.ARCHIVE_ORG_SECRET_KEY }}
          SCOPE: ${{ inputs.scope || 'all' }}
          VERIFY_ONLY: ${{ inputs.verify_only && 'true' || 'false' }}
        run: |
          args=(--scope "$SCOPE")
          if [[ "$VERIFY_ONLY" == true ]]; then args+=(--verify-only); fi
          python capture.py "${args[@]}"
      - name: Preserve unresolved jobs even when verification fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .capture-state
          key: wayback-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish per-URL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: capture-report.json
          if-no-files-found: warn
          retention-days: 90
